[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdi-app"
version = "0.2.0"
description = "Procesador de CFDI XML (SAT) a Excel, con GUI PySide6."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PySide6>=6.8",
]

[tool.setuptools.packages.find]
where = ["src"]
